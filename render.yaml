services:
  - type: web
    name: url-uptime
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerfileContext: .
    disk:
      name: uptime-data
      mountPath: /app/database
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_PATH
        value: /app/database/uptime.db
      - key: CHECK_INTERVAL_MS
        value: "300000"
      - key: REQUEST_TIMEOUT_MS
        value: "10000"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ALLOW_PRIVATE_IPS
        value: "false"
      - key: LOG_LEVEL
        value: info
